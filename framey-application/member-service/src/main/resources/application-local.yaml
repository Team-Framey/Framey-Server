spring:
  datasource:
    url: ${LOCAL_DB_URL:-jdbc:postgresql://localhost:5433/framey_local}
    username: ${LOCAL_DB_USERNAME:-root}
    password: ${LOCAL_DB_PASSWORD:-root12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
