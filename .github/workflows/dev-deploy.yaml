name: Dev Deploy

on:
  push:
    branches: [dev]
    # Claude 리뷰 보고서 변경 시 배포 제외
    paths-ignore:
      - '.claude/reports/**'

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5

        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
          DEV_DB_USER: ${{ secrets.DEV_DB_USER }}
          DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}

        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}

          envs: DEV_DB_URL,DEV_DB_USER,DEV_DB_PASSWORD
          command_timeout: 30m

          script: |
            set -e

            echo "🚀 FRAMEY DEV 환경 배포 시작"
            echo "📦 배포 대상 커밋: ${{ github.sha }}"

            /opt/framey/bin/deploy-dispatch.sh ${{ github.sha }}

            echo "✅ FRAMEY DEV 환경 배포 완료"
