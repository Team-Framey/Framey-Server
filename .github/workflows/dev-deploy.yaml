name: Dev Deploy

on:
  push:
    #dev 브렌치
    branches: [dev]
    #claude 리뷰 폴더 문서 ignore
    paths-ignore:
      - '.claude/reviews/**'

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DEV EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DEV EC2
        uses: appleboy/ssh-action@v1

        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
          DEV_DB_USER: ${{ secrets.DEV_DB_USER }}
          DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}

        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}

          envs: DEV_DB_URL,DEV_DB_USER,DEV_DB_PASSWORD

          command_timeout: 30m

          script: |
            set -e
            echo "======================================="
            echo "FRAMEY DEV DEPLOYMENT"
            echo "Commit: ${{ github.sha }}"
            echo "======================================="
            /opt/framey/bin/deploy-dispatch.sh ${{ github.sha }}
