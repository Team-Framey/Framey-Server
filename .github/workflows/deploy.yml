name: Deploy

on:
  push:
    branches:
      - dev
      - chore/FBE-9-Cicd # 테스트 후 제거
  workflow_dispatch:

# 배포가 동시에 두 개 돌지 않도록 직렬화. 진행 중인 배포는 취소하지 않고 대기시킴.
concurrency:
  group: deploy-framey-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/team-framey/framey-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (Checkstyle + Test 포함)
        run: ./gradlew build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 & 푸시 (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: EC2 배포 명령 전송 (SSM SendCommand)
        id: ssm-send
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # 이번 커밋 SHA 기준으로 deploy/deploy.sh를 내려받아 실행하는 원격 스크립트 구성
          DEPLOY_SCRIPT_URL="https://raw.githubusercontent.com/${REPO}/${SHA}/deploy/deploy.sh"
          TARGET_IMAGE="${IMAGE_NAME}:${SHA}"

          COMMANDS_JSON=$(jq -n \
            --arg url "$DEPLOY_SCRIPT_URL" \
            --arg image "$TARGET_IMAGE" \
            '[
              "curl -fsSL \($url) -o /home/ubuntu/framey/deploy.sh",
              "bash /home/ubuntu/framey/deploy.sh \($image)"
            ]')

          PARAMETERS_JSON=$(jq -n --argjson commands "$COMMANDS_JSON" '{commands: $commands}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "framey-server deploy ${SHA}" \
            --timeout-seconds 600 \
            --parameters "$PARAMETERS_JSON" \
            --query "Command.CommandId" \
            --output text)

          echo "command-id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: ${COMMAND_ID}"

      - name: SSM 명령 완료 대기 (직접 폴링, 최대 5분)
        env:
          COMMAND_ID: ${{ steps.ssm-send.outputs.command-id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=30
          INTERVAL_SECONDS=10
          STATUS="Pending"
          INVOCATION="{}"

          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            if RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" 2>/dev/null); then
              INVOCATION="$RESULT"
              STATUS=$(echo "$INVOCATION" | jq -r '.Status')
              case "$STATUS" in
                Pending | InProgress | Delayed) ;;
                *) break ;;
              esac
            fi

            echo "[$attempt/$MAX_ATTEMPTS] 상태: ${STATUS} - ${INTERVAL_SECONDS}초 후 재확인"
            sleep "$INTERVAL_SECONDS"
          done

          echo "===== EC2 stdout ====="
          echo "$INVOCATION" | jq -r '.StandardOutputContent // ""'
          echo "===== EC2 stderr ====="
          echo "$INVOCATION" | jq -r '.StandardErrorContent // ""'
          echo "===== 최종 상태: ${STATUS} ====="

          if [[ "$STATUS" != "Success" ]]; then
            echo "배포 실패: SSM 명령 상태 = ${STATUS}" >&2
            exit 1
          fi
