# PR의 Compound Engineering 기록 검증 및 배지 갱신
name: Compound Badge

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: compound-badge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # fork PR은 배지 갱신 권한이 없어 제외
    if: github.event.pull_request.head.repo.full_name == github.repository

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify
        id: verify
        run: |
          set -euo pipefail

          echo "🔎 PR #${PR_NUMBER} Compound Engineering 기록 검증"
          bash .github/scripts/verify-compound.sh

      - name: Badge
        env:
          RESULT: ${{ steps.verify.outputs.result }}
        run: |
          set -euo pipefail

          echo "📋 검증 결과: $RESULT"
          echo "🔖 PR 배지 갱신"
          bash .github/scripts/update-compound-badge.sh
