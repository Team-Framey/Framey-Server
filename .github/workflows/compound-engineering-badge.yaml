#-------------------------------------------
#PR 생성/수정 →
# 코드 가져오기 → 검증 스크립트 실행 → 결과(pass/fail/not-applicable) → 배지 붙이기/떼기
#-------------------------------------------

name: Compound Engineering Badge
#PR에 올라온 Compound Engineering 기록이 규칙에 맞는지 자동으로 검사하고, 통과한 PR에만 배지를 붙이는 워크플로우
on:
  pull_request:
    branches: [dev]
    # pr 처음생성시, 새 커밋 push, 수정, pr 재오픈시
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: compound-badge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  verify:
    name: Verify Compound Engineering
    runs-on: ubuntu-latest

    # fork PR은 GITHUB_TOKEN이 읽기 전용이라 배지 갱신 불가
    if: github.event.pull_request.head.repo.full_name == github.repository

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:

      - name: Checkout PR merge ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify records
        id: verify
        run: |
          set -euo pipefail
          bash .github/scripts/verify-compound.sh

      - name: Update PR badge
        env:
          RESULT: ${{ steps.verify.outputs.result }}
        run: |
          set -euo pipefail
          bash .github/scripts/update-compound-badge.sh
