# pr 올렸을때 작동 workflow
name: PR CI

on:
  pull_request:
    #dev 브렌치
    branches: [dev]
    #PR 작동 이벤트 정의 (PR 생성, 수정, 다시 오픈)
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Build, Test and SonarQube
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TEST_DB_URL: jdbc:postgresql://localhost:5432/framey_test
      TEST_DB_USER: test
      TEST_DB_PASSWORD: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: framey_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d framey_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew clean build --no-daemon

      - name: SonarQube Cloud Analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: team-framey

        run: |
          ./gradlew sonar \
            -Dsonar.qualitygate.wait=true \
            --no-daemon
