# PR 생성 및 변경 시 빌드, 테스트, 코드 품질 검증
name: PR CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TEST_DB_URL: jdbc:postgresql://localhost:5432/framey_test
      TEST_DB_USER: test
      TEST_DB_PASSWORD: test12345

    # 테스트용 PostgreSQL
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: framey_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d framey_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build & Test
        run: |
          set -euo pipefail

          echo "🧪 Gradle 빌드 및 테스트 시작"

          chmod +x gradlew
          ./gradlew clean build --no-daemon

          echo "✅ 빌드 및 테스트 완료"

      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: team-framey

        run: |
          set -euo pipefail

          echo "🔎 테스트 커버리지 및 코드 품질 분석"

          ./gradlew jacocoTestReport sonar \
            -Dsonar.qualitygate.wait=true \
            --no-daemon

          echo "✅ 코드 품질 검증 완료"

      - name: Test Report
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/build/test-results/**/*.xml'
          check_name: Test Results
          comment_title: 🧪 테스트 결과
          comment_mode: always
