# pr 올렸을때 작동 workflow
name: PR CI

on:
  #dev 브렌치
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: framey_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew clean test check --no-daemon
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/framey_test
          TEST_DB_USER: test
          TEST_DB_PASSWORD: test
