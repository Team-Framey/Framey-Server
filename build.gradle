plugins {
	id 'org.springframework.boot' version '4.1.0' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'com.framey'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'checkstyle'
	apply plugin: 'io.spring.dependency-management'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	// Checkstyle
	checkstyle {
		toolVersion = '10.26.1'

		configFile = rootProject.file(
				'common/checkstyle/naver-checkstyle-rules.xml'
		)

		// Warning/Error 발생 시 빌드 실패
		maxWarnings = 0
		maxErrors = 0
		ignoreFailures = false

		configProperties = [
				'suppressionFile': rootProject
						.file('common/checkstyle/naver-checkstyle-suppressions.xml')
						.absolutePath
		]
	}

	tasks.withType(Checkstyle).configureEach {
		reports {
			xml.required = true
			html.required = true
		}
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}
}