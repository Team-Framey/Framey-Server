# Framey 서비스별 독립 배포(간이 MSA) 진입점.
# 서비스가 추가되어도 이 파일은 수정하지 않는다.
# - upstream 정의: /etc/nginx/conf.d/framey-upstream-<name>.conf (deploy.sh가 서비스별로 생성/갱신, Blue/Green 전환 시 재작성)
# - location 정의: /etc/nginx/framey/locations/<name>.conf (deploy.sh가 첫 배포 시 생성)
server {
	listen 80 default_server;
	server_name _;

	include /etc/nginx/framey/locations/*.conf;

	# 등록되지 않은 경로는 모두 차단 (actuator 등 내부 엔드포인트 외부 노출 방지)
	location / {
		return 404;
	}
}
