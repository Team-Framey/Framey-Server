# HTTP → HTTPS
server {
    listen 80;
    server_name dev-swagger.framey.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;

    server_name dev-swagger.framey.kr;

    ssl_certificate /etc/letsencrypt/live/dev-swagger.framey.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-swagger.framey.kr/privkey.pem;

    # =========================
    # OpenAPI
    # =========================
    location = /api-docs/member {
        proxy_pass http://member-dev:8081/v3/api-docs;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api-docs/collage {
        proxy_pass http://collage-dev:8082/v3/api-docs;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api-docs/archive {
        proxy_pass http://archive-dev:8083/v3/api-docs;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Member Service
    # =========================
    location = /api/v1/members {
        proxy_pass http://member-dev:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/v1/members/ {
        proxy_pass http://member-dev:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================
    # Collage Service
    # =========================
    location = /api/v1/collages {
        proxy_pass http://collage-dev:8082;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/v1/collages/ {
        proxy_pass http://collage-dev:8082;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================
    # Archive Service
    # =========================
    location = /api/v1/archives {
        proxy_pass http://archive-dev:8083;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/v1/archives/ {
        proxy_pass http://archive-dev:8083;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================
    # Swagger UI
    # =========================

    location / {
        proxy_pass http://swagger-dev:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
