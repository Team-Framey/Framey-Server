services:
  postgres:
    image: postgres:16-alpine
    container_name: framey-local-postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-framey_local}
      POSTGRES_USER: ${LOCAL_DB_USER:-root}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-root12345}

    volumes:
      - framey-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  framey-postgres-data:
