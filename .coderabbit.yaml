language: ko-KR
early_access: true
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: true

  # PR 전체 변경 사항 요약
  high_level_summary: true
  high_level_summary_in_walkthrough: false

  #PR 본문에 요약 삽입
  high_level_summary_placeholder: '@coderabbitai 요약'

  #PR 요약 내용 — 핵심만 간결하게, 상세 설명은 생략
  high_level_summary_instructions: |
    PR의 변경 사항을 분석하여 한국어로 "핵심만" 요약해주세요.
    아래 3개 섹션 형식만 사용하고, 그 외 섹션·배경 설명·구현 세부사항은 작성하지 않습니다.

    ### New Features
    - 새롭게 추가된 기능/API 중 핵심만 (최대 3개)

    ### Bug Fixes / Changes
    - 버그 수정, 기존 로직 변경, 성능 개선 중 핵심만 (최대 3개)

    ### Tests
    - 추가되거나 수정된 테스트 중 핵심만 (최대 2개)

    작성 규칙:
      - 실제 코드 변경 사항을 근거로 작성합니다.
      - 변경 사항이 없는 섹션은 통째로 생략합니다.
      - 각 항목은 한 줄, 한 문장으로만 작성합니다 (부연 설명·쉼표로 여러 내용 나열 금지).
      - 섹션당 bullet 개수 제한을 넘기지 않습니다 — 넘치면 가장 핵심적인 변경만 선택합니다.
      - 구현 세부 사항(클래스/메서드명, 코드 레벨 설명)은 쓰지 않고 기능·동작의 변화만 설명합니다.
      - Redis, SSE, RabbitMQ 등 핵심 기술만 필요한 경우에 한해 언급합니다.
      - 확인되지 않은 기능이나 테스트는 작성하지 않습니다.
      - 인사말, 배경 설명, 마무리 문장은 작성하지 않습니다.

  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: false

  #pr 닫히면 리뷰 중단
  abort_on_close: true

  #자동 리뷰 활성화
  auto_review:
    enabled: true
    auto_incremental_review: true #변경부분만
    base_branches:
      - dev
      - main

  # CodeRabbit 역할: PR 단계 코드/설정 파일 정확성 1차 점검.
  # 설계 의도·아키텍처 판단(Claude), 버그/취약점 게이트(SonarCloud)는 담당하지 않음
  tools:
    # 스크립트/빌드 산출물 코드 정확성
    shellcheck:
      enabled: true               # .githooks, deploy 스크립트 등 shell 문법/오류
    hadolint:
      enabled: true               # member-service 등 Dockerfile

    #  설정 파일 구조·보안 검사
    yamllint:
      enabled: true               # application-*.yaml, workflows
    checkov:
      enabled: true               # docker-compose, nginx, workflows 검사
    gitleaks:
      enabled: true               # 시크릿 하드코딩 탐지 — env 설정

    # 문서 포맷 (내용 품질/문법은 범위 밖)
    markdownlint:
      enabled: true

    # 기존 CI 결과 통합 표시 (중복 실행 아님)
    github-checks:
      enabled: true
      timeout_ms: 90000

    # 프로젝트 전용 패턴 룰 — rule_dirs 정의 전까지는 essential_rules만 적용
    ast-grep:
      packages: []
      rule_dirs: []
      util_dirs: []
      essential_rules: true

    # 자연어 문법 검사는 코드 정확성 범위 밖이자 한국어 PR에서 오탐이 많아 비활성화
    languagetool:
      enabled: false

    #무관한 언어
    detekt:
      enabled: false
    ruff:
      enabled: false
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
    golangci-lint:
      enabled: false
    biome:
      enabled: false

chat:
  auto_reply: true
